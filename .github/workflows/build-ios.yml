name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets build-ios.bat trigger it on demand

jobs:
  build:
    runs-on: macos-latest   # matches your working SignX workflow
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm install

      - name: Add iOS platform (fresh each build)
        run: |
          # Remove any committed ios/ to guarantee a clean generate
          rm -rf ios
          npx cap add ios

      - name: Sync web → native
        run: npx cap sync ios

      - name: CocoaPods install
        working-directory: ios/App
        run: |
          # Capacitor 6 scaffold uses this path
          pod install --repo-update

      - name: Build unsigned archive
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          APP_DIR="$RUNNER_TEMP/App.xcarchive/Products/Applications"
          APP_NAME=$(ls "$APP_DIR" | head -n 1)
          echo "Found app: $APP_NAME"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR/$APP_NAME" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr RetroBowlModded.ipa Payload
          ls -la RetroBowlModded.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroBowlModded-unsigned-ipa
          path: ${{ runner.temp }}/RetroBowlModded.ipa
          if-no-files-found: error
          retention-days: 30
